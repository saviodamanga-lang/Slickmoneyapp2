<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>SlickMoney</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0F1410"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="SlickMoney">
<style>
:root{--g:#3DDC5C;--gd:#1E7A35;--gm:#27A844;--bg:#0F1410;--c1:#141A16;--c2:#1A2119;--c3:#1F2A22;--t:#DDEAE0;--t2:#6B8572;--t3:#4A6054;--r:#F04D4D;--o:#F0944D;--b:#4D9EF0;--y:#F0D44D;--ink:#080A09;--bd:#ffffff14;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=light]{--bg:#F3F7F4;--c1:#fff;--c2:#EBF2ED;--c3:#DFEAE2;--t:#0F1410;--t2:#4A6054;--t3:#6B8572;--g:#1E7A35;--bd:#0000001a;color-scheme:light}
@media(prefers-color-scheme:light){:root:not([data-theme=dark]){--bg:#F3F7F4;--c1:#fff;--c2:#EBF2ED;--c3:#DFEAE2;--t:#0F1410;--t2:#4A6054;--t3:#6B8572;--g:#1E7A35;--bd:#0000001a;color-scheme:light}}
*{box-sizing:border-box}html,body{margin:0;height:100%}body{background:var(--bg);color:var(--t);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#splash{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:9;transition:opacity .5s}
#splash img{width:130px;animation:p 1.2s ease-out}#splash b{font-size:26px;letter-spacing:.5px}@keyframes p{from{opacity:0;transform:scale(.85)}}
#app{display:flex;min-height:100%}nav{width:220px;background:var(--c1);border-right:1px solid var(--bd);padding:16px 10px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:18px;padding:4px 8px 14px}.brand img{width:32px}
nav button{all:unset;cursor:pointer;padding:10px 12px;border-radius:10px;color:var(--t2);display:flex;gap:10px}nav button:hover{background:var(--c2)}nav button.on{background:var(--c3);color:var(--g)}
nav button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--g);outline-offset:2px}
main{flex:1;padding:24px;max-width:1000px;width:100%;margin:auto}h1{font-size:22px;margin:0 0 4px}.sub{color:var(--t2);margin:0 0 18px;font-size:13px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.card{background:var(--c1);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:12px}
.k{color:var(--t2);font-size:12px}.v{font-size:24px;font-weight:700}.pos{color:var(--g)}.neg{color:var(--r)}.warn{color:var(--o)}
.btn{all:unset;cursor:pointer;background:var(--g);color:var(--ink);padding:8px 14px;border-radius:10px;font-weight:600;font-size:14px}.btn.s{background:var(--c3);color:var(--t)}.btn.d{background:none;color:var(--r);padding:4px 8px}
input,select{background:var(--c2);color:var(--t);border:1px solid var(--bd);border-radius:10px;padding:9px 11px;font:inherit;max-width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.bar{height:8px;background:var(--c3);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gm)}
table{width:100%;border-collapse:collapse}td,th{padding:8px 6px;border-bottom:1px solid var(--bd);text-align:left;font-size:14px}th{color:var(--t2);font-weight:500}
.tag{font-size:11px;background:var(--c3);color:var(--t2);border-radius:6px;padding:2px 7px}.demo{background:var(--y);color:var(--ink);font-size:11px;padding:2px 8px;border-radius:6px;font-weight:600}
.msg{padding:10px 12px;border-radius:12px;margin:6px 0;max-width:85%;white-space:pre-wrap}.me{background:var(--c3);margin-left:auto}.ai{background:var(--c2);border:1px solid var(--bd)}
#chat{max-height:50vh;overflow:auto}.tbl{overflow-x:auto}
@media(max-width:760px){#app{flex-direction:column-reverse}nav{width:100%;height:auto;position:fixed;top:auto;bottom:0;left:0;right:0;flex-direction:row;overflow-x:auto;border-top:1px solid var(--bd);border-right:0;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}.brand{display:none}nav button{flex-direction:column;align-items:center;font-size:11px;gap:0;white-space:nowrap}main{padding:16px 14px 90px}}
</style></head><body>

const $=s=>document.querySelector(s),fmt=n=>n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),pct=n=>(n>0?'+':'')+n.toFixed(0)+'%';
const now=new Date(),Y=now.getFullYear(),M=now.getMonth(),D=now.getDate(),DIM=new Date(Y,M+1,0).getDate(),left=DIM-D+1;
const iso=(y,m,d)=>new Date(y,m,d).toISOString().slice(0,10),ym=s=>s.slice(0,7),cur=ym(iso(Y,M,1)),prv=ym(iso(Y,M-1,1));
const CATS=['Moradia','Alimentação','Transporte','Delivery','Lazer','Saúde','Contas','Metas','Renda'];let id=1;
function seed(){const t=[];


return{tx:t,open:0,plan:'free',theme:'dark',bills:[],goals:[]}}
let S;try{S=JSON.parse(localStorage.getItem('sm2'))}catch(e){}if(!S||!S.tx){S=seed()}id=Math.max(0,...S.tx.map(x=>x.id))+1;
const save=()=>{try{localStorage.setItem('sm2',JSON.stringify(S))}catch(e){}};
const sum=(f)=>S.tx.filter(f).reduce((a,x)=>a+x.v,0),inc=m=>sum(x=>x.ty=='r'&&ym(x.date)==m),exp=(m,c)=>sum(x=>x.ty=='d'&&ym(x.date)==m&&(!c||x.c==c));
/* motor financeiro (separado da interface) */
const E={saldo:()=>S.open+sum(x=>x.ty=='r')-sum(x=>x.ty=='d'),
bills:()=>S.bills.filter(b=>!b.paid).reduce((a,b)=>a+b.v,0),reserva:()=>S.goals.reduce((a,g)=>a+Math.max(0,Math.min(g.m,g.t-g.s)),0),
livre:(extra=0)=>E.saldo()-E.bills()-E.reserva()-extra,diario:(extra=0)=>Math.max(0,E.livre(extra))/left,
hoje:()=>sum(x=>x.ty=='d'&&x.date==iso(Y,M,D)),
sim(v){const g=S.goals.slice().sort((a,b)=>b.m-a.m)[0],dia=g?g.m/30:0;return{livre:E.livre(v),diario:E.diario(v),cabe:E.livre(v)>=0,atraso:dia?Math.ceil(v/dia):0,meta:g&&g.n}},

function demo(){return'<span class="demo">DADOS FICTÍCIOS</span>'}
function dash(){const r=E.rec(),d=E.diario(),ent=inc(cur),sai=exp(cur),ant=exp(prv),cats=CATS.filter(c=>c!='Renda').map(c=>[c,exp(cur,c)]).filter(x=>x[1]).sort((a,b)=>b[1]-a[1]),mx=cats[0]?cats[0][1]:1;
return`<h1>Visão geral</h1><p class="sub">${now.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}</p>
<div class="card"><div class="k">Dinheiro diário recomendado</div><div class="v pos">${fmt(d)}</div><p style="margin:6px 0 0">${!S.tx.length&&!S.open?'Informe seu saldo inicial e registre suas primeiras transações para calcular seu dinheiro diário.':E.livre()>0?`Você pode gastar ${fmt(d)} hoje e continuar dentro do seu planejamento.`:'Seu dinheiro livre está esgotado: contas e reservas já ocupam o saldo.'}</p><div class="k" style="margin-top:6px">Cálculo: (saldo − contas a pagar − reserva das metas) ÷ ${left} dias restantes. Valores previstos de receita não entram.</div></div>
${r?`<div class="card" style="border-color:var(--o)"><b class="warn">Você ultrapassou o orçamento de hoje em ${fmt(r.ex)}.</b><p style="margin:4px 0">${r.ok?`Podemos reduzir ${fmt(r.pd)} por dia em gastos flexíveis nos próximos 5 dias.`:'Não há folga para compensar em 5 dias sem pressionar o orçamento. Alternativas: prolongar o prazo ou revisar uma meta opcional.'}</p><div class="k">Um gasto fora do planejamento não significa que você perdeu o controle. Vamos reorganizar o restante do mês.</div></div>`:''}
<div class="card"><form onsubmit="setOpen(event)" class="row"><label class="k" for="so">Saldo inicial (R$)</label><input id="so" type="number" step="0.01" value="${S.open}" style="width:140px"><button class="btn s">Salvar</button><button type="button" class="btn" onclick="go('tx')">+ Registrar transação</button></form></div><div class="grid"><div class="card"><div class="k">Saldo total</div><div class="v">${fmt(E.saldo())}</div></div><div class="card"><div class="k">Reservado p/ contas</div><div class="v warn">${fmt(E.bills())}</div></div><div class="card"><div class="k">Reservado p/ metas (mês)</div><div class="v">${fmt(E.reserva())}</div></div><div class="card"><div class="k">Livre para gastar</div><div class="v pos">${fmt(Math.max(0,E.livre()))}</div></div></div>
<div class="grid"><div class="card"><div class="k">Receitas do mês</div><div class="v">${fmt(ent)}</div></div><div class="card"><div class="k">Despesas do mês</div><div class="v">${fmt(sai)}</div><div class="k">${ant?pct((sai-ant)/ant*100)+' vs mês anterior':''}</div></div></div>
<div class="card"><b>Despesas por categoria</b>${cats.map(([c,v])=>`<div style="margin-top:10px"><div class="row" style="justify-content:space-between"><span>${c}</span><span>${fmt(v)}</span></div><div class="bar"><i style="width:${v/mx*100}%"></i></div></div>`).join('')||'<p class="k">Sem despesas neste mês.</p>'}</div>
<div class="card"><b>Próximas contas</b><form onsubmit="addBill(event)" class="row" style="margin:8px 0"><input id="bn" placeholder="Nome da conta" required maxlength="40"><input id="bv" type="number" min="0.01" step="0.01" placeholder="Valor" required style="width:110px"><button class="btn s">Adicionar conta</button></form>${S.bills.length?'':'<p class="k">Nenhuma conta cadastrada.</p>'}${S.bills.map((b,i)=>`<div class="row" style="justify-content:space-between;margin-top:8px"><span>${b.n} ${b.paid?'<span class="tag">paga</span>':''}</span><span>${fmt(b.v)} ${b.paid?'':`<button class="btn s" onclick="pay(${i})">Marcar paga</button>`}</span></div>`).join('')}</div>`}
function pay(i){const b=S.bills[i];b.paid=true;S.tx.push({id:id++,desc:b.n,v:b.v,c:'Contas',ty:'d',date:iso(Y,M,D)});save();go(cv)}
function addBill(e){e.preventDefault();S.bills.push({n:$('#bn').value.trim(),v:+$('#bv').value,paid:false});save();go('dash')}
function setOpen(e){e.preventDefault();S.open=parseFloat($('#so').value)||0;save();go('dash')}
let fil='all';
function txv(){const l=S.tx.filter(x=>fil=='all'||x.ty==fil).sort((a,b)=>b.date.localeCompare(a.date));
return`<h1>Transações</h1><p class="sub">Registro manual. Os indicadores atualizam a cada alteração.</p><div class="card"><form onsubmit="addTx(event)" class="row"><input id="td" placeholder="Descrição" required maxlength="60"><input id="tv" type="number" step="0.01" min="0.01" placeholder="Valor" required style="width:110px"><select id="tt"><option value="d">Despesa</option><option value="r">Receita</option></select><select id="tc">${CATS.map(c=>`<option>${c}</option>`).join('')}</select><input id="tdt" type="date" value="${iso(Y,M,D)}" required><button class="btn">Adicionar</button></form></div>
<div class="row" style="margin-bottom:8px"><select onchange="fil=this.value;go('tx')" aria-label="Filtro"><option value="all">Todas</option><option value="d" ${fil=='d'?'selected':''}>Despesas</option><option value="r" ${fil=='r'?'selected':''}>Receitas</option></select></div>
<div class="card tbl">${l.length?`<table><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th>Valor</th><th></th></tr>${l.map(x=>`<tr><td>${x.date.split('-').reverse().join('/')}</td><td>${x.desc.replace(/</g,'&lt;')}</td><td><span class="tag">${x.c}</span></td><td class="${x.ty=='r'?'pos':''}">${x.ty=='r'?'+':'−'}${fmt(x.v)}</td><td><button class="btn d" onclick="delTx(${x.id})" aria-label="Excluir">Excluir</button></td></tr>`).join('')}</table>`:'<p class="k">Nenhuma transação. Adicione a primeira acima.</p>'}</div>`}
function addTx(e){e.preventDefault();const v=parseFloat($('#tv').value);if(!(v>0))return;S.tx.push({id:id++,desc:$('#td').value.trim(),v,ty:$('#tt').value,c:$('#tc').value,date:$('#tdt').value});save();go('tx')}
function delTx(i){if(confirm('Excluir esta transação?')){S.tx=S.tx.filter(x=>x.id!=i);save();go('tx')}}
function metas(){return`<h1>Metas</h1><p class="sub">As metas alimentam o dinheiro diário e a Slick AI.</p><div class="card"><form onsubmit="addG(event)" class="row"><input id="gn" placeholder="Nome da meta" required maxlength="40"><input id="gt" type="number" min="1" step="0.01" placeholder="Valor desejado" required style="width:140px"><input id="gm" type="number" min="0" step="0.01" placeholder="Reserva mensal" required style="width:140px"><button class="btn">Criar meta</button></form></div>
${S.goals.map((g,i)=>{const p=Math.min(100,g.s/g.t*100),f=g.t-g.s;return`<div class="card"><div class="row" style="justify-content:space-between"><b>${g.n.replace(/</g,'&lt;')}</b><span>${p.toFixed(0)}%</span></div><div class="bar" style="margin:8px 0"><i style="width:${p}%"></i></div><div class="k">${fmt(g.s)} de ${fmt(g.t)} · faltam ${fmt(Math.max(0,f))}${g.m>0&&f>0?` · ~${Math.ceil(f/g.m)} meses com ${fmt(g.m)}/mês`:''}</div><div class="row" style="margin-top:8px"><button class="btn s" onclick="contrib(${i})">Contribuir</button><button class="btn d" onclick="delG(${i})">Excluir</button></div></div>`}).join('')||'<p class="k">Nenhuma meta ainda.</p>'}`}
function addG(e){e.preventDefault();S.goals.push({n:$('#gn').value.trim(),t:+$('#gt').value,s:0,m:+$('#gm').value});save();go('metas')}
function contrib(i){const v=parseFloat(prompt('Valor da contribuição (R$):'));if(v>0){S.goals[i].s+=v;S.tx.push({id:id++,desc:'Meta: '+S.goals[i].n,v,c:'Metas',ty:'d',date:iso(Y,M,D)});save();go('metas')}}
function delG(i){if(confirm('Excluir esta meta?')){S.goals.splice(i,1);save();go('metas')}}
let rm=cur;
function replay(){const ms=[...new Set([cur,...S.tx.map(x=>ym(x.date))])].sort();if(!ms.includes(rm))rm=cur;const i=ms.indexOf(rm),p=ms[i-1],e=exp(rm),pe=p?exp(p):0;
const rows=CATS.filter(c=>c!='Renda').map(c=>[c,exp(rm,c),p?exp(p,c):0]).filter(x=>x[1]||x[2]);
return`<h1>Replay do mês</h1><p class="sub">Compara o mês escolhido com o anterior.</p><div class="row" style="margin-bottom:10px"><select onchange="rm=this.value;go('replay')" aria-label="Mês">${ms.map(m=>`<option ${m==rm?'selected':''}>${m}</option>`).join('')}</select></div>
<div class="grid"><div class="card"><div class="k">Receitas</div><div class="v">${fmt(inc(rm))}</div></div><div class="card"><div class="k">Despesas</div><div class="v">${fmt(e)}</div></div><div class="card"><div class="k">Economizado</div><div class="v pos">${fmt(inc(rm)-e)}</div></div></div>
<div class="card tbl"><table><tr><th>Categoria</th><th>Este mês</th><th>Anterior</th><th>Diferença</th></tr>${rows.map(([c,a,b])=>`<tr><td>${c}</td><td>${fmt(a)}</td><td>${p?fmt(b):'—'}</td><td class="${a>b?'warn':'pos'}">${p?(a>b?'+':'')+fmt(a-b)+(b?' ('+pct((a-b)/b*100)+')':''):'—'}</td></tr>`).join('')}</table></div>
<div class="card">${p?rows.filter(r=>r[2]).map(([c,a,b])=>`<p style="margin:4px 0">${a<b?`Você gastou ${Math.abs((a-b)/b*100).toFixed(0)}% menos com ${c.toLowerCase()} do que no mês anterior.`:a>b?`Suas despesas com ${c.toLowerCase()} aumentaram ${fmt(a-b)}.`:`${c} ficou igual.`}</p>`).join(''):'<p class="k">Sem mês anterior para comparar.</p>'}<p class="k">Despesas maiores não são necessariamente ruins: podem refletir uma necessidade pontual.${p&&e!=pe?` Total ${e>pe?'subiu':'caiu'} ${fmt(Math.abs(e-pe))}.`:''}</p></div>`}
function ai(){return`<h1>Slick AI</h1><p class="sub">Os números vêm do motor financeiro do app e a IA só os explica. Se ela estiver indisponível, o app responde com cálculos locais. Limite diário de perguntas: Grátis 5, Pro 30, Plus Max 100.</p><div class="card"><div id="chat"></div><form onsubmit="ask(event)" class="row" style="margin-top:10px"><input id="q" placeholder="Ex.: Posso comprar algo de R$ 150 hoje?" style="flex:1;min-width:200px" required><button class="btn">Enviar</button></form></div>`}
function chatDraw(){const c=$('#chat');c.innerHTML=(chatH.length?chatH:[{r:'ai',h:'Pergunte: “Quanto gastei este mês?”, “Onde estou gastando mais?” ou “Posso comprar algo de R$ 150?”'}]).map(m=>`<div class="msg ${m.r=='me'?'me':'ai'}">${m.h}</div>`).join('');c.scrollTop=1e9}
async function ask(e){e.preventDefault();let loc=0;const q=$('#q').value,l=q.toLowerCase(),n=l.match(/(\d+[.,]?\d*)/),h=s=>{loc=1;chatH.push({r:'ai',h:s})};chatH.push({r:'me',h:q.replace(/</g,'&lt;')});
if(/compr|gast.*\d|posso/.test(l)&&n){const v=parseFloat(n[1].replace(',','.')),s=E.sim(v);h(`Simulação de ${fmt(v)}:<br>• Dinheiro livre depois: ${fmt(s.livre)}<br>• Diário recomendado passaria de ${fmt(E.diario())} para ${fmt(s.diario)}<br>${s.cabe?`• Pode atrasar a meta “${s.meta}” em cerca de ${s.atraso} dia(s).`:'• Esta compra usaria dinheiro reservado para contas ou metas.'}<br><span class="k">Cálculo: livre = saldo − contas − reserva das metas.</span><br><button class="btn s" onclick="adiar()">Adiar decisão</button> <button class="btn s" onclick="cont(${v})">Continuar mesmo assim</button>`)}
else if(/quanto gastei/.test(l))h(`Neste mês você gastou ${fmt(exp(cur))} (receitas: ${fmt(inc(cur))}).`);
else if(/onde/.test(l)){const t=CATS.filter(c=>c!='Renda').map(c=>[c,exp(cur,c)]).sort((a,b)=>b[1]-a[1])[0];h(`Sua maior categoria é ${t[0]}, com ${fmt(t[1])}.`)}
chatDraw();$('#q').value='';const pu=/compr|gast.*\d|posso/.test(l)&&n;await aiAsk(q,loc,pu?E.sim(parseFloat(n[1].replace(',','.'))):null)}
const LIM={free:5,pro:30,max:100};
function ctx(sim){const cats={};CATS.filter(c=>c!='Renda').forEach(c=>{const v=exp(cur,c);if(v)cats[c]=v});return{saldo:E.saldo(),contasAPagar:E.bills(),reservaMetasMes:E.reserva(),dinheiroLivre:E.livre(),diarioRecomendado:E.diario(),diasRestantes:left,receitasMes:inc(cur),despesasMes:exp(cur),despesasMesAnterior:exp(prv),despesasPorCategoria:cats,metas:S.goals.map(g=>({nome:g.n,alvo:g.t,acumulado:g.s,reservaMensal:g.m})),simulacaoDeCompra:sim}}
async function aiAsk(q,had,sim){if(had&&!sim)return;const k='smq'+iso(Y,M,D);let u=0;try{u=+localStorage.getItem(k)||0}catch(e){}
if(u>=LIM[S.plan]){chatH.push({r:'ai',h:'Você atingiu o limite diário de perguntas à IA do seu plano. Os cálculos do app continuam disponíveis.'});return chatDraw()}
chatH.push({r:'ai',h:'<i class="k">Pensando…</i>'});chatDraw();const pos=chatH.length-1;
try{const r=await fetch('/api/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({pergunta:q,contexto:ctx(sim)})});if(!r.ok)throw 0;const d=await r.json();if(!d.texto)throw 0;chatH[pos]={r:'ai',h:d.texto.replace(/</g,'&lt;')+'<br><span class="k">Texto gerado por IA a partir dos números do app.</span>'};try{localStorage.setItem(k,u+1)}catch(e){}}
catch(e){chatH.splice(pos,1);if(!had)chatH.push({r:'ai',h:'A IA não está disponível agora. Tente perguntas sobre gastos do mês, categorias ou uma compra com valor.'})}chatDraw()}
function adiar(){chatH.push({r:'ai',h:'Combinado: nada foi registrado. Você pode voltar quando quiser.'});chatDraw()}
function cont(v){if(confirm('Registrar despesa de '+fmt(v)+'?')){S.tx.push({id:id++,desc:'Compra (via Slick AI)',v,c:'Lazer',ty:'d',date:iso(Y,M,D)});save();chatH.push({r:'ai',h:'Despesa registrada. O diário foi recalculado.'});chatDraw()}}
function planos(){const P=[['free','Grátis','R$ 0',['Dashboard e transações manuais','Orçamentos e metas','Dinheiro diário básico','Replay básico','Slick AI limitada']],['pro','Pro','R$ 10/mês',['Tudo do Grátis','Modo Foco Financeiro','Análises mais detalhadas']],['max','Plus Max','R$ 20/mês',['Tudo do Pro','IA que aprende com suas preferências','Comparações históricas avançadas','Planos de recuperação personalizáveis']]];
return`<h1>Planos</h1><p class="sub">Plano atual: <b>${P.find(p=>p[0]==S.plan)[1]}</b>. <span class="demo">DEMONSTRAÇÃO</span> Nenhum pagamento é processado.</p><div class="grid">${P.map(p=>`<div class="card" style="${p[0]==S.plan?'border-color:var(--g)':''}"><b>${p[1]}</b><div class="v">${p[2]}</div><ul style="padding-left:18px;color:var(--t2)">${p[3].map(f=>`<li>${f}</li>`).join('')}</ul><button class="btn ${p[0]==S.plan?'s':''}" onclick="S.plan='${p[0]}';save();go('planos')">${p[0]==S.plan?'Plano atual':'Selecionar (demo)'}</button></div>`).join('')}</div><p class="k">A divisão de recursos entre Pro e Plus Max é uma proposta inicial e pode ser ajustada.</p>`}
function cfg(){return`<h1>Ajustes</h1><p class="sub">Preferências deste navegador.</p><div class="card row"><span>Tema</span><button class="btn s" onclick="theme('dark')">Escuro</button><button class="btn s" onclick="theme('light')">Claro</button></div><div class="card"><p style="margin-top:0">Apaga todas as transações, contas, metas e o saldo inicial salvos neste navegador.</p><button class="btn d" onclick="if(confirm('Apagar todos os seus dados?')){S=seed();save();go('dash')}">Apagar meus dados</button></div>`}
function theme(t){S.theme=t;document.documentElement.dataset.theme=t;save()}
if(S.theme)document.documentElement.dataset.theme=S.theme;go('dash');setTimeout(()=>{$('#splash').style.opacity=0;setTimeout(()=>$('#splash').remove(),500)},1400);
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
